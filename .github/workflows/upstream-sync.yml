name: Release Upstream Update

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "opencarwings/**"
      - ".github/workflows/upstream-sync.yml"
      - ".github/scripts/prepare-upstream-release.py"
  workflow_dispatch:
    inputs:
      target_upstream:
        description: Optional full upstream SHA; otherwise follow main (pushes release the checked-in pin)
        required: false
        default: ""
        type: string
      recover_missing_tag:
        description: Optional missing tag to recover from an existing upstream release commit
        required: false
        default: ""
        type: string
      dev_validated:
        description: Required only for tag recovery; confirm this exact app source was tested in dev
        required: false
        default: false
        type: boolean
      tested_commit:
        description: Required only for tag recovery; full tested app commit SHA
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: opencarwings-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.candidate.outputs.mode }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      has_changes: ${{ steps.candidate.outputs.has_changes }}
      target_upstream: ${{ steps.candidate.outputs.target_upstream }}
      new_version: ${{ steps.candidate.outputs.new_version }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      release_sha: ${{ steps.candidate.outputs.release_sha }}
    steps:
      - name: Checkout main without publish credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Test release preparation
        run: python3 .github/scripts/test-prepare-upstream-release.py

      - name: Prepare exact upstream candidate
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_UPSTREAM: ${{ inputs.target_upstream }}
          RECOVERY_TAG: ${{ inputs.recover_missing_tag }}
          DEV_VALIDATED: ${{ inputs.dev_validated }}
          TESTED_COMMIT: ${{ inputs.tested_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          if [ -n "$RECOVERY_TAG" ]; then
            test "$EVENT_NAME" = workflow_dispatch
            test -z "$TARGET_UPSTREAM"
            python3 .github/scripts/prepare-upstream-release.py recover \
              --tag "$RECOVERY_TAG" --tested-commit "$TESTED_COMMIT" --dev-validated "$DEV_VALIDATED"
          else
            python3 .github/scripts/prepare-upstream-release.py prepare \
              --event "$EVENT_NAME" --target "$TARGET_UPSTREAM"
          fi

      - name: Build and smoke-test the exact candidate
        if: steps.candidate.outputs.has_changes == 'true' || steps.candidate.outputs.mode == 'recover'
        env:
          VERSION: ${{ steps.candidate.outputs.new_version }}
        run: |
          set -euo pipefail
          ruby .github/scripts/validate-metadata.rb
          .github/scripts/build-smoke-test.sh "$VERSION"

      - name: Stage only verified release files
        if: steps.candidate.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-artifact/opencarwings
          cp opencarwings/config.yaml opencarwings/CHANGELOG.md opencarwings/.upstream_sync release-artifact/opencarwings/

      - name: Upload verified files including the hidden upstream pin
        if: steps.candidate.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.publish.outputs.release_sha }}
    steps:
      - name: Checkout the tested app source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Download verified release files
        uses: actions/download-artifact@v4
        with:
          name: upstream-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Verify, commit, tag and publish atomically
        id: publish
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          VERSION: ${{ needs.prepare.outputs.new_version }}
          TARGET_UPSTREAM: ${{ needs.prepare.outputs.target_upstream }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$TAG" = "v$VERSION"
          python3 .github/scripts/prepare-upstream-release.py verify --base "$BASE_SHA" --version "$VERSION" --target "$TARGET_UPSTREAM"
          git diff --check
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing overwrite" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opencarwings/config.yaml opencarwings/CHANGELOG.md opencarwings/.upstream_sync
          git commit -m "Upstream sync - $TAG"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git tag "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  keepalive:
    needs: prepare
    if: needs.prepare.outputs.mode == 'normal' && needs.prepare.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the unchanged app source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Keep scheduled checks active during quiet upstream periods
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          LAST_ACTIVITY=$(git log -1 --format=%ct)
          if [ "$(( $(date +%s) - LAST_ACTIVITY ))" -lt 2592000 ]; then
            echo "Recent repository activity already keeps scheduled checks active"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep upstream update checks active"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git diff-tree --no-commit-id --name-only -r HEAD)"
          git push origin HEAD:main

  recover-publish:
    needs: prepare
    if: needs.prepare.outputs.mode == 'recover'
    runs-on: ubuntu-latest
    environment: opencarwings-release
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.publish.outputs.release_sha }}
    steps:
      - name: Checkout the verified untagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Recover only the missing tag
        id: publish
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          python3 .github/scripts/prepare-upstream-release.py recover \
            --tag "$TAG" --tested-commit "$BASE_SHA" --dev-validated true
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing recovery" >&2
            exit 1
          fi
          git tag "$TAG" "$BASE_SHA"
          git push origin "refs/tags/$TAG"
          echo "release_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

  release-notes:
    needs: [prepare, publish, recover-publish]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.publish.result == 'success' || needs.recover-publish.result == 'success' ||
      (needs.publish.result == 'skipped' && needs.recover-publish.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create or repair release notes without another version bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.publish.outputs.release_sha || needs.recover-publish.outputs.release_sha || needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin tag "$TAG"
          test "$(git rev-parse "${TAG}^{commit}")" = "$EXPECTED_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release notes already exist for $TAG"
          else
            python3 .github/scripts/prepare-upstream-release.py notes --tag "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --verify-tag --title "OpenCarwings HA app $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
